name: Newsletter diaria

on:
  schedule:
    # GitHub puede retrasar los cron ejecutados exactamente en punto.
    # Se mantienen varias ventanas: main.py envía una sola vez por día.
    - cron: "17 5 * * *"  # 07:17 en verano (CEST)
    - cron: "17 6 * * *"  # 07:17 en invierno (CET)
    - cron: "17 7 * * *"  # respaldo si GitHub retrasa alguna ejecución
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin enviar correos"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: newsletter

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar edición y enviar
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--scheduled"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python main.py $ARGS
      - name: Guardar edición en el repositorio
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || (git commit -m "Edición $(date -u +%F)" && git push)
